<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Electric Sheep • Control Center Login</title>
    <script>
        try { if (localStorage.getItem("sheep-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=3.9">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body.login-page {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas, #f2f5f9);
            font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
            color: var(--text-primary, #0f172a);
        }

        .login-card {
            background: var(--surface-card, #ffffff);
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-subtle, #d8e1ee);
            box-shadow: var(--shadow-card);
        }

        .login-logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #1e2b42;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            --icon-accent: #22d3ee;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 24px 0;
            text-align: center;
            color: var(--text-primary, #14171c);
            letter-spacing: -0.02em;
        }

        .google-signin-btn {
            width: 100%;
            height: 42px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .dev-signin-btn {
            width: 100%;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0 16px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 18px 0 6px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-subtle, #dad6ca);
        }

        .divider span {
            padding: 0 10px;
            font-size: 11px;
            color: var(--text-muted, #556070);
            font-weight: 500;
        }

        .error-alert {
            width: 100%;
            background: #fce8e6;
            border: 1px solid #f2b8b5;
            color: #8c1d18;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            line-height: 1.4;
            margin-bottom: 16px;
            display: none;
            align-items: flex-start;
            gap: 8px;
            box-sizing: border-box;
        }

        .loading-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(106, 53, 156, 0.18);
            border-top-color: var(--color-primary, #6a359c);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state span {
            font-size: 12.5px;
            color: var(--text-secondary, #38414e);
            font-weight: 500;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 12px;
            font-family: var(--font-mono, 'IBM Plex Mono', monospace);
            font-variant-numeric: tabular-nums;
            color: var(--text-muted, #556070);
            text-align: center;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path d="M5.25 19.5H11.5M6.75 19.5C3.6 16.9 3.25 11.4 6.1 7.6C8.95 3.8 14.65 3.4 18.1 6.65C20.9 9.3 20.95 13.85 18.2 16.45" stroke="#EEF1F6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="6.1" cy="7.6" r="1.15" fill="#EEF1F6"/>
                <circle cx="18.1" cy="6.65" r="1.15" fill="#EEF1F6"/>
                <path d="M18.2 16.45C15.85 18.65 11.9 18.35 10.05 15.75C8.55 13.65 9.15 10.65 11.55 9.55C13.45 8.7 15.45 9.95 15.35 12.05" stroke="#BE94FF" stroke-width="1.9" stroke-linecap="round"/>
                <circle cx="13.5" cy="12.8" r="2.1" fill="#BE94FF"/>
            </svg>
        </div>
        <h1 class="login-title">Control Center Login</h1>

        <div id="error-box" class="error-alert">
            <div id="error-message">Authentication failed.</div>
        </div>

        <button type="button" id="google-signin-btn" class="google-signin-btn btn btn-primary" onclick="signInWithGoogle()">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#ffffff" fill-opacity="0.88" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#ffffff" fill-opacity="0.75" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#ffffff" fill-opacity="0.92" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in
        </button>

        <div id="dev-section" style="display: none; width: 100%;">
            <div class="divider">
                <span>or</span>
            </div>
            <button type="button" id="dev-signin-btn" class="dev-signin-btn btn btn-secondary" onclick="signInAsDeveloper()">
                Local dev
            </button>
        </div>

        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <span>Signing in...</span>
        </div>

        <div class="auth-footer">
            Allowed: <strong id="allowed-domain-text">example.com</strong>
        </div>

        <div style="margin-top: 12px; text-align: center;">
            <a href="https://github.com/davenportjw/agentic-memory" target="_blank" rel="noopener noreferrer" style="color: var(--color-primary, #6a359c); text-decoration: none; font-size: 12.5px; font-weight: 500;">
                GitHub ↗
            </a>
        </div>
    </div>

    <script>
        let isLocalDevMode = false;

        fetch("/api/auth/config")
            .then(res => res.json())
            .then(config => {
                isLocalDevMode = config.isLocalDev || false;
                if (config.allowedEmailDomains) {
                    document.getElementById("allowed-domain-text").innerText = config.allowedEmailDomains;
                }
                if (isLocalDevMode) {
                    document.getElementById("dev-section").style.display = "block";
                }
                firebase.initializeApp({
                    apiKey: config.apiKey,
                    authDomain: config.authDomain,
                    projectId: config.projectId,
                    storageBucket: config.storageBucket,
                    messagingSenderId: config.messagingSenderId,
                    appId: config.appId
                });
            })
            .catch(err => {
                console.error("Failed to load auth config:", err);
                showError("Unable to load authentication settings from server.");
            });

        function showLoading() {
            document.getElementById("google-signin-btn").style.display = "none";
            if (document.getElementById("dev-section")) {
                document.getElementById("dev-section").style.display = "none";
            }
            document.getElementById("error-box").style.display = "none";
            document.getElementById("loading-state").style.display = "flex";
        }

        function hideLoading() {
            document.getElementById("google-signin-btn").style.display = "flex";
            if (isLocalDevMode) {
                document.getElementById("dev-section").style.display = "block";
            }
            document.getElementById("loading-state").style.display = "none";
        }

        function showError(message) {
            hideLoading();
            document.getElementById("error-message").innerText = message;
            document.getElementById("error-box").style.display = "flex";
        }

        function signInWithGoogle() {
            showLoading();
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then(result => result.user.getIdToken())
                .then(idToken => {
                    return fetch("/api/auth/session", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ idToken: idToken })
                    });
                })
                .then(async response => {
                    if (!response.ok) {
                        const errText = await response.text();
                        let errorDetail = "Unauthorized account access.";
                        try {
                            const errJson = JSON.parse(errText);
                            if (errJson.detail) errorDetail = errJson.detail;
                            else if (errJson.error) errorDetail = errJson.error;
                        } catch (e) {
                            if (errText) errorDetail = errText;
                        }
                        throw new Error(errorDetail);
                    }
                    return response.json();
                })
                .then(data => {
                    try {
                        if (data && data.email) {
                            sessionStorage.setItem("electric_sheep_user_email", data.email);
                        }
                    } catch (_) {}
                    window.location.href = "/";
                })
                .catch(error => {
                    console.error("Sign-in failed:", error);
                    showError(error.message || "Failed to authenticate with Google.");
                });
        }

        function signInAsDeveloper() {
            showLoading();
            fetch("/api/auth/session", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ idToken: "local-dev-login" })
            })
            .then(async response => {
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || "Developer authentication failed.");
                }
                return response.json();
            })
            .then(data => {
                try {
                    if (data && data.email) {
                        sessionStorage.setItem("electric_sheep_user_email", data.email);
                    }
                } catch (_) {}
                window.location.href = "/";
            })
            .catch(error => {
                console.error("Developer sign-in failed:", error);
                showError(error.message || "Failed developer login.");
            });
        }
    </script>
</body>
</html>
